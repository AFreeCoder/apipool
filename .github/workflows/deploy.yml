name: Deploy to apipool_vps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sub2api-production-deploy
  # 生产发布必须排队；取消已进入目标机的发布会留下不可判定的中间状态。
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}
      deploy_image: ${{ steps.image.outputs.deploy_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set image metadata
        id: image
        shell: bash
        run: |
          set -Eeuo pipefail
          APP_VERSION="$(tr -d '\r\n' < backend/cmd/server/VERSION)"
          APP_BUILD_DATE="$(git log -1 --format=%cI HEAD)"
          IMAGE_REPO="ghcr.io/afreecoder/apipool"
          IMAGE_TAG="sha-${GITHUB_SHA}"

          if [ -z "$APP_VERSION" ]; then
            echo "backend/cmd/server/VERSION 为空，停止构建" >&2
            exit 1
          fi

          {
            echo "app_version=${APP_VERSION}"
            echo "app_build_date=${APP_BUILD_DATE}"
            echo "image_repo=${IMAGE_REPO}"
            echo "image_tag=${IMAGE_TAG}"
            echo "deploy_image=${IMAGE_REPO}:${IMAGE_TAG}"
            echo "image_tags<<EOF"
            echo "${IMAGE_REPO}:${IMAGE_TAG}"
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "${IMAGE_REPO}:main"
              echo "${IMAGE_REPO}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.image.outputs.app_version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.image.outputs.app_build_date }}
          tags: ${{ steps.image.outputs.image_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: [self-hosted, linux, x64, sub2api-prod-deploy]
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
      GHCR_USER: ${{ github.repository_owner }}
    steps:
      - name: Checkout exact release
        uses: actions/checkout@v6
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Deploy on apipool_vps
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GHCR_TOKEN"
          test "$GITHUB_REF" = refs/heads/main
          test "$IMAGE_TAG" = "sha-${GITHUB_SHA}"
          printf '%s\n' "$GHCR_TOKEN" | sudo /usr/local/sbin/sub2api-runner-deploy \
            "$GITHUB_WORKSPACE" \
            "$IMAGE_TAG" \
            "$GHCR_USER"
